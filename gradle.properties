# NeoForge (also provides the vanilla game for compiling core, via NeoForm)
moddev_version=2.0.148
neoforge_version=26.3.0.115
neoform_version=26.3-1
# Paper
paperweight_version=2.0.0-beta.24
paper_dev_bundle=26.3.build.258-stable
run_paper_version=3.1.0
